name: CI

# Build against the pinned tecgraf releases: what a user who installs CD and
# IM actually gets. Release assets do not expire and do not move, so a red run
# here means this binding changed, not that upstream did.
#
# Testing upstream's unreleased tip is ci-upstream.yml's job. Splitting them
# keeps the two kinds of breakage apart -- and this workflow no longer depends
# on CI artifacts, which expire after 14 days and could turn it red for
# reasons unconnected to any commit here.
on:
  push:
    branches: [main, master, 'feat/*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CD_VERSION: v2.0.1
  IM_VERSION: v2.0.1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not hide the others.
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            asset: linux-amd64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            asset: linux-arm64
          - name: macOS arm64
            os: macos-15
            asset: macos-arm64
          - name: Windows x64
            os: windows-2022
            asset: windows-x64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sbcl --no-progress -y
          cygpath -w "/c/Program Files/Steel Bank Common Lisp" >> "$GITHUB_PATH"

      # Libraries come from each upstream project's own CI, on every
      # platform. The maintainer's Homebrew tap would be tidier and was tried
      # first, but it does not work here for two independent reasons:
      #
      #   GitHub's Ubuntu runners have no Homebrew at all -- `brew: command
      #   not found` -- so Linux could never have used it.
      #
      #   On macOS the tap installs tecgraf-im fine and then fails building
      #   tecgraf-cd with "fatal error: 'glib.h' file not found". CD's
      #   cd_util.c includes <glib.h> on any non-Windows build that does not
      #   define USE_ICONV, but CD's CMake never looks for glib, so the include
      #   path only appears when some other dependency's pkg-config happens to
      #   supply it. That is an upstream build issue, not something to work
      #   around here.
      #
      # Artifacts avoid both: they are built by each project's own CI, which
      # gets the dependency handling right, and nothing is compiled here.

      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # Exactly what libcd.so.5 and libim.so record as NEEDED, read off
          # the published artifact with objdump rather than guessed:
          #
          #   libX11 libXrender libcairo libpangocairo libpango libgobject
          #   libglib libfontconfig libfreetype libOpenGL libftgl
          #
          # pango, libOpenGL and libftgl were the three missed on the first
          # attempt, and dlopen reports a missing transitive dependency the
          # same way it reports a missing library -- so the binding said only
          # that it could not load libcd.
          sudo apt-get install -y --no-install-recommends \
            libtiff6 libjpeg8 libpng16-16 zlib1g libexif12 liblzf1 liblz4-1 \
            libfftw3-double3 libfftw3-single3 libgomp1 \
            libcairo2 libfreetype6 libfontconfig1 \
            libglib2.0-0 libgobject-2.0-0 \
            libpango-1.0-0 libpangocairo-1.0-0 \
            libopengl0 libftgl2 \
            libx11-6 libxext6 libxrender1 libxft2 liblua5.4-0

      - name: Install runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libtiff jpeg-turbo libpng libexif liblzf lz4 fftw libomp \
                       cairo pango freetype fontconfig glib ftgl lua

      # Release archives, not CI artifacts. Both are installed trees, so the
      # unpack step below finds lib/ and include/ in each without caring which
      # upstream workflow produced them.
      - name: Download CD ${{ env.CD_VERSION }} and IM ${{ env.IM_VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) ext=zip ;;
            *)       ext=tar.gz ;;
          esac
          mkdir -p cd-libs im-libs
          gh release download "$CD_VERSION" --repo lispnik/tecgraf-cd \
            --pattern "tecgraf-cd-${CD_VERSION}-${{ matrix.asset }}.${ext}" \
            --dir cd-libs --clobber
          gh release download "$IM_VERSION" --repo lispnik/tecgraf-im \
            --pattern "tecgraf-im-${IM_VERSION}-${{ matrix.asset }}.${ext}" \
            --dir im-libs --clobber
          ls -la cd-libs im-libs

      - name: Unpack and locate the libraries
        run: |
          # Three shapes to cope with, decided by each upstream job rather
          # than by any convention: CD ships a tarball of its install tree on
          # Linux and macOS, a *zip* of the same on Windows, and IM ships
          # build/lib directly. Unpack whatever is actually there and then
          # search, rather than assuming a shape -- assuming tar is what made
          # Windows fail with "no libcd in the CD artifact" while the DLL sat
          # inside an unopened zip.
          for t in $(find cd-libs im-libs -name '*.tar.gz'); do
            tar -xzf "$t" -C "$(dirname "$t")" || true
          done
          for z in $(find cd-libs im-libs -name '*.zip'); do
            d="$(dirname "$z")"
            # Git Bash on the Windows runner has no unzip; 7z and Python are
            # both there, so fall through rather than depend on one of them.
            if command -v unzip >/dev/null 2>&1; then unzip -q -o "$z" -d "$d"
            elif command -v 7z >/dev/null 2>&1; then 7z x -y -o"$d" "$z" >/dev/null
            else python -m zipfile -e "$z" "$d"; fi
          done
          echo "CD artifact:"; ls -R cd-libs | head -40

          # Test the search result BEFORE dirname. `dirname ""` is ".", which
          # is non-empty, so a guard placed after it passes on an empty search;
          # that is how CD_LIBRARY_PATH once became the repository root and the
          # failure surfaced several steps later as LIBRARY-NOT-FOUND.
          cd_lib="$(find cd-libs \( -name 'libcd.so*' -o -name 'libcd*.dylib' \
                                     -o -name 'cd.dll' -o -name 'libcd.dll' \) | head -1)"
          test -n "$cd_lib" || { echo "::error::no libcd in the CD artifact"; exit 1; }
          cd_dir="$(dirname "$cd_lib")"

          im_lib="$(find im-libs \( -name 'libim.so*' -o -name 'libim*.dylib' \
                                     -o -name 'im.dll' -o -name 'libim.dll' \) | head -1)"
          test -n "$im_lib" || { echo "::error::no libim in the IM artifact"; exit 1; }
          im_dir="$(dirname "$im_lib")"
          echo "libcd in $cd_dir"; echo "libim in $im_dir"

          cd_abs="$PWD/$cd_dir"; im_abs="$PWD/$im_dir"
          case "$RUNNER_OS" in
            Linux)   echo "LD_LIBRARY_PATH=$cd_abs:$im_abs:$LD_LIBRARY_PATH"   >> "$GITHUB_ENV" ;;
            macOS)   echo "DYLD_LIBRARY_PATH=$cd_abs:$im_abs:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV" ;;
            Windows) cygpath -w "$cd_abs" >> "$GITHUB_PATH"
                     cygpath -w "$im_abs" >> "$GITHUB_PATH" ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then
            cd_abs="$(cygpath -m "$cd_abs")"; im_abs="$(cygpath -m "$im_abs")"
          fi
          echo "CD_LIBRARY_PATH=$cd_abs" >> "$GITHUB_ENV"
          echo "IM_LIBRARY_PATH=$im_abs" >> "$GITHUB_ENV"

      # Both projects build macOS dylibs with absolute install names pointing
      # at their own builders -- deliberately, since that makes them
      # dlopen-able from a runtime with no rpath. Downloaded here those paths
      # do not exist, so libcd's reference to libim dangles.
      - name: Repair macOS install names
        if: runner.os == 'macOS'
        run: |
          for dir in "$CD_LIBRARY_PATH" "$IM_LIBRARY_PATH"; do
            for lib in "$dir"/lib*.dylib; do
              [ -f "$lib" ] || continue
              install_name_tool -id "$lib" "$lib" 2>/dev/null || true
              otool -L "$lib" | awk 'NR>1 {print $1}' | while read -r dep; do
                case "$dep" in
                  */libim*.dylib|*/libcd*.dylib)
                    base="$(basename "$dep")"
                    for cand in "$CD_LIBRARY_PATH/$base" "$IM_LIBRARY_PATH/$base"; do
                      [ -f "$cand" ] && install_name_tool -change "$dep" "$cand" "$lib" 2>/dev/null || true
                    done ;;
                esac
              done
            done
          done
          otool -L "$CD_LIBRARY_PATH"/libcd*.dylib | head -8

      - name: Install and configure ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          bin="$(find "$HOME" -type f \( -name ocicl -o -name ocicl.exe \) 2>/dev/null \
                   | grep -v '/ocicl-src/' | head -1)"
          test -n "$bin" || { echo "ocicl binary not found after setup"; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          ocicl setup
          ocicl install

      # The im BINDINGS -- the Lisp system, not the C library -- are a sibling
      # project rather than an ocicl registry system, so there is nothing for
      # ocicl to fetch. Clone it and put it on the source registry beside this
      # checkout.
      - name: Check out the im bindings
        run: git clone --depth 1 https://github.com/lispnik/im.git "$HOME/im"

      - name: Set up the source registry
        run: |
          tree="$PWD"; im="$HOME/im"
          if [ "$RUNNER_OS" = Windows ]; then
            tree="$(cygpath -m "$tree")"; im="$(cygpath -m "$im")"
          fi
          echo "LISP_TREE=$tree" >> "$GITHUB_ENV"
          echo "LISP_IM=$im" >> "$GITHUB_ENV"

      # A dlopen failure names the library that would not open, not the
      # transitive dependency actually missing -- so print the link
      # requirements before trying, and the diagnosis is in the log already
      # when it fails.
      - name: Show the libraries' link requirements
        run: |
          case "$RUNNER_OS" in
            Linux)
              for lib in "$CD_LIBRARY_PATH"/libcd.so* "$IM_LIBRARY_PATH"/libim.so*; do
                [ -f "$lib" ] || continue
                echo "== $lib"; objdump -p "$lib" 2>/dev/null | grep NEEDED || true
                # Print ldd in full. Grepping only for "not found" and sending
                # stderr to /dev/null made a *failing* ldd look identical to a
                # clean one -- it printed nothing either way.
                ldd "$lib" 2>&1 || true
              done ;;
            macOS)
              for lib in "$CD_LIBRARY_PATH"/libcd*.dylib "$IM_LIBRARY_PATH"/libim.dylib; do
                [ -f "$lib" ] || continue
                echo "== $lib"; otool -L "$lib" | head -20
              done ;;
          esac

      - name: Report what loaded
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") (:tree \"$LISP_IM\") :ignore-inherited-configuration))" \
            --eval '(asdf:load-system :cd)' \
            --eval '(progn
                      (format t "~%CD ~A (~A)~%" (cd:version) (cd:version-date))
                      (format t "libcd: ~A~%" (cd:library-pathname))
                      (format t "drivers: ~{~A~^ ~}~%" (cd:drivers)))'

      - name: Test
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") (:tree \"$LISP_IM\") :ignore-inherited-configuration))" \
            --eval '(asdf:test-system :cd)'

      # Proves the binding draws, not merely that it loads: a canvas that
      # creates and then writes nothing would pass every check above.
      - name: Draw something
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") (:tree \"$LISP_IM\") :ignore-inherited-configuration))" \
            --eval '(asdf:load-system :cd)' \
            --eval '(progn
                      (cd:with-canvas (c (cd:svg-canvas #p"ci-out.svg"
                                                        :width-mm 100 :height-mm 100))
                        (cd.ffi::%cd-canvas-line (cd:handle c) 0 0 200 200))
                      (let ((size (with-open-file (s #p"ci-out.svg") (file-length s))))
                        (format t "~%wrote ci-out.svg, ~D bytes~%" size)
                        (when (zerop size)
                          (format *error-output* "empty SVG~%")
                          (uiop:quit 1))))'
          head -3 ci-out.svg
