name: CI

on:
  push:
    branches: [main, master, 'feat/*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # lispnik/tecgraf-cd does not emit one of these yet. Listening now means the
  # wiring is already in place when it does; until then this is inert.
  repository_dispatch:
    types: [tecgraf-cd-build-complete]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing must not hide the others.
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            source: brew
          # No upstream artifact is needed here: brew builds CD and IM from
          # source, so the arm64 Linux leg works on the same footing as amd64.
          # Upstream now publishes arm64 artifacts too, for consumers that
          # take the artifact route.
          - name: Linux arm64
            os: ubuntu-24.04-arm
            source: brew
          - name: macOS arm64
            os: macos-15
            source: brew
          # Windows has no Homebrew, so it consumes the upstream CI artifacts
          # instead. Both are needed: libcd links against libim, and the CD
          # artifact carries only CD's own install tree.
          - name: Windows x64
            os: windows-2022
            source: artifacts
            cd-artifact: cd-windows-Release
            im-artifact: im-libs-windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sbcl --no-progress -y
          cygpath -w "/c/Program Files/Steel Bank Common Lisp" >> "$GITHUB_PATH"

      # CD and IM both come from the maintainer's tap, and tecgraf-cd already
      # depends_on tecgraf-im -- so one install provides both libraries and
      # every third-party dependency they were linked against.
      #
      # This is deliberately not the artifact route used for Windows below.
      # Artifacts have to be paired by upstream run, unpacked, and on macOS
      # repaired with install_name_tool because they carry absolute install
      # names baked to the builder's path. brew has none of those problems;
      # the cost is that the formulae build from source, so this step is the
      # slow one.
      - name: Install CD and IM from the tap
        if: matrix.source == 'brew'
        run: |
          brew tap lispnik/tecgraf
          brew install lispnik/tecgraf/tecgraf-cd
          echo "CD_LIBRARY_PATH=$(brew --prefix tecgraf-cd)/lib" >> "$GITHUB_ENV"
          echo "IM_LIBRARY_PATH=$(brew --prefix tecgraf-im)/lib" >> "$GITHUB_ENV"
          ls -la "$(brew --prefix tecgraf-cd)/lib" "$(brew --prefix tecgraf-im)/lib"

      - name: Download CD artifact (Windows)
        if: matrix.source == 'artifacts'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: lispnik/tecgraf-cd
          workflow: ci-windows.yml
          # tecgraf-cd's default branch is main; tecgraf-im's is master.
          branch: main
          name: ${{ matrix.cd-artifact }}
          path: cd-libs/

      - name: Download IM artifact (Windows)
        if: matrix.source == 'artifacts'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: lispnik/tecgraf-im
          workflow: ci-windows.yml
          branch: master
          name: ${{ matrix.im-artifact }}
          path: im-libs/

      - name: Unpack and locate the libraries (Windows)
        if: matrix.source == 'artifacts'
        run: |
          # The CD artifact is a tarball of the install tree, not a flat
          # directory of libraries the way IM's is.
          find cd-libs -name '*.tar.gz' -exec tar -xzf {} -C cd-libs \; || true
          cd_dir="$(dirname "$(find cd-libs -name 'cd.dll' -o -name 'libcd.dll' | head -1)")"
          test -n "$cd_dir" || { echo "::error::no cd.dll in the artifact"; ls -R cd-libs; exit 1; }
          echo "CD_LIBRARY_PATH=$(cygpath -m "$PWD/$cd_dir")" >> "$GITHUB_ENV"
          echo "IM_LIBRARY_PATH=$(cygpath -m "$PWD/im-libs")" >> "$GITHUB_ENV"
          # Windows resolves dependent DLLs through PATH, and these load each
          # other, so both directories have to be on it.
          cygpath -w "$PWD/$cd_dir" >> "$GITHUB_PATH"
          cygpath -w "$PWD/im-libs" >> "$GITHUB_PATH"

      - name: Install and configure ocicl
        run: |
          git clone --depth 1 https://github.com/ocicl/ocicl.git "$HOME/ocicl-src"
          ( cd "$HOME/ocicl-src" && sbcl --non-interactive --load setup.lisp )
          bin="$(find "$HOME" -type f \( -name ocicl -o -name ocicl.exe \) 2>/dev/null \
                   | grep -v '/ocicl-src/' | head -1)"
          test -n "$bin" || { echo "ocicl binary not found after setup"; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: |
          ocicl setup
          ocicl install

      # The im BINDINGS -- the Lisp system, not the C library -- are a sibling
      # project rather than an ocicl registry system, so there is nothing for
      # ocicl to fetch. Clone it and put it on the source registry beside this
      # checkout.
      - name: Check out the im bindings
        run: git clone --depth 1 https://github.com/lispnik/im.git "$HOME/im"

      - name: Set up the source registry
        run: |
          tree="$PWD"; im="$HOME/im"
          if [ "$RUNNER_OS" = Windows ]; then
            tree="$(cygpath -m "$tree")"; im="$(cygpath -m "$im")"
          fi
          echo "LISP_TREE=$tree" >> "$GITHUB_ENV"
          echo "LISP_IM=$im" >> "$GITHUB_ENV"

      - name: Report what loaded
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") (:tree \"$LISP_IM\") :ignore-inherited-configuration))" \
            --eval '(asdf:load-system :cd)' \
            --eval '(progn
                      (format t "~%CD ~A (~A)~%" (cd:version) (cd:version-date))
                      (format t "libcd: ~A~%" (cd:library-pathname))
                      (format t "drivers: ~{~A~^ ~}~%" (cd:drivers)))'

      - name: Test
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") (:tree \"$LISP_IM\") :ignore-inherited-configuration))" \
            --eval '(asdf:test-system :cd)'

      # Proves the binding draws, not merely that it loads: a canvas that
      # creates and then writes nothing would pass every check above.
      - name: Draw something
        run: |
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval "(asdf:initialize-source-registry '(:source-registry (:tree \"$LISP_TREE\") (:tree \"$LISP_IM\") :ignore-inherited-configuration))" \
            --eval '(asdf:load-system :cd)' \
            --eval '(progn
                      (cd:with-canvas (c (cd:svg-canvas #p"ci-out.svg"
                                                        :width-mm 100 :height-mm 100))
                        (cd.ffi::%cd-canvas-line (cd:handle c) 0 0 200 200))
                      (let ((size (with-open-file (s #p"ci-out.svg") (file-length s))))
                        (format t "~%wrote ci-out.svg, ~D bytes~%" size)
                        (when (zerop size)
                          (format *error-output* "empty SVG~%")
                          (uiop:quit 1))))'
          head -3 ci-out.svg
